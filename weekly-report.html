<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运营专项周报 · 只读演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#263238;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:16px}
h1{font-size:22px;margin:0 0 5px}h2{font-size:19px}.muted{color:#87919e;font-size:12px}.notice{background:#fff7e6;border:1px solid #ffe3ae;padding:12px;border-radius:8px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card,.box{background:white;border:1px solid #e6e8ed;border-radius:9px;padding:18px}
.card{cursor:pointer;text-align:left;font:inherit;min-height:135px}.card:hover,button:hover{border-color:#1677ff}.card strong{display:block;font-size:17px;margin-bottom:18px}
button{cursor:pointer}.btn{background:white;border:1px solid #d9dce2;border-radius:6px;padding:8px 12px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0}
.tag{display:inline-block;background:#eaf4ff;color:#1677ff;padding:5px 8px;border-radius:5px}.report{display:grid;grid-template-columns:200px 1fr;gap:15px}.box p{line-height:1.7}.row{display:block;width:100%;text-align:left;background:white;border:1px solid #e6e8ed;border-radius:6px;padding:13px;margin:9px 0}
.hide{display:none}@media(max-width:650px){main{padding:14px}.grid,.report{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><div><h1>📊 运营专项周报</h1><span class="muted">专项进展 · 周报浏览 · 站外只读示例</span></div><span class="tag">虚构数据</span></header>
<div class="notice">本页仅展示原应用的界面结构和浏览方式。专项、负责人、日期、进展均为虚构示例；不连接内部系统，不能提交或编辑。</div>

<section id="home">
<div class="bar"><div><h2>📋 本周进展看板</h2><span class="muted">演示周期 · 8 个示例专项</span></div><button class="btn" onclick="historyView()">历史记录</button></div>
<div class="grid" id="cards"></div>
</section>

<section id="project" class="hide">
<div class="bar"><button class="btn" onclick="show('home')">← 返回看板</button><h2 id="projectName"></h2></div>
<div class="box"><strong>🔗 常驻资料</strong><p class="muted">示例资料位置；不包含内部文档链接。</p></div>
<div class="report" style="margin-top:15px">
<div class="box"><strong>周报列表</strong><button class="row" onclick="setWeek('示例周 A')">示例周 A</button><button class="row" onclick="setWeek('示例周 B')">示例周 B</button></div>
<div class="box"><h2 id="reportTitle"></h2><p class="muted">只读演示稿</p>
<h3>本周进展</h3><p>完成示例阶段目标，并与示例合作方对齐下一步安排。</p>
<h3>风险与待协同</h3><p>等待资料确认。本段不代表真实业务进展。</p>
<h3>下周计划</h3><p>推进方案确认并跟进演示排期。</p>
<p class="muted">讨论区不展示内部评论，也不收集新评论。</p></div></div>
</section>

<section id="history" class="hide">
<div class="bar"><button class="btn" onclick="show('home')">← 返回看板</button><h2>历史周报 · 虚构示例</h2></div>
<div id="historyItems"></div>
</section>
</main>
<script>
const names=['示例专项 A','示例专项 B','示例专项 C','示例专项 D','示例专项 E','示例专项 F','示例专项 G','示例专项 H'];
const icons=['🌱','🛍️','🔗','👣','🎬','🏔️','🏋️','🎁'];
let current=0;
function show(id){for(const s of ['home','project','history'])document.getElementById(s).classList.toggle('hide',s!==id);scrollTo(0,0)}
function openProject(i){current=i;document.getElementById('projectName').textContent=icons[i]+' '+names[i];setWeek('示例周 A');show('project')}
function setWeek(w){document.getElementById('reportTitle').textContent=names[current]+' · '+w}
function historyView(){document.getElementById('historyItems').innerHTML=names.map((n,i)=>`<button class="row" onclick="openProject(${i})">${icons[i]} ${n} — 查看虚构周报 →</button>`).join('');show('history')}
document.getElementById('cards').innerHTML=names.map((n,i)=>`<button class="card" onclick="openProject(${i})"><strong>${icons[i]} ${n}　›</strong><span class="tag">示例负责人 ${String.fromCharCode(65+i)}</span><p class="muted">最近一次：示例周 B · ${i<3?'本周已提交示例':'本周尚未提交示例'}</p></button>`).join('');
</script>
</body>
</html>
